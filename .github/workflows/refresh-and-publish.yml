# Keeps Before the Vote in step with the City of Toronto's record, then publishes the site.
#
# When it runs:
#   - every 3 hours (times are UTC; 17 minutes past, to avoid the busy top of the hour)
#   - on demand: Actions tab > "Refresh from the City and publish" > Run workflow
#   - after every push to main, so the published site always matches the code
#
# What it does: run the tests, read the City of Toronto's Open Data portal (public notices
# and the Council voting record, pipeline/refresh.py), save changed cards to the repo ONLY
# if the City's data changed (including old notice cards that were removed), then publish
# web/ to GitHub Pages. It never downloads secure.toronto.ca pages.
#
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Optional: Settings > Secrets and variables > Actions > OPENROUTER_API_KEY, to draft plain
# sentences for new cards. Fetching, choosing, matching, extracting and checking never use AI.

name: Refresh from the City and publish

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # to save changed records back to the repo
  pages: write      # to publish the site
  id-token: write   # required by GitHub Pages

concurrency:
  group: refresh-and-publish
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the download libraries
        run: pip install -r pipeline/requirements.txt

      - name: Run the tests
        working-directory: pipeline
        run: python -m unittest -v

      - name: Read the City's Open Data and rebuild
        working-directory: pipeline
        env:
          # Optional. With this secret set, cards with no explanation get AI drafts, shown only
          # if every quote passes the word-for-word check. Without it, drafting is skipped.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python refresh.py --source opendata

      - name: Save to the repo if the City's data changed
        run: |
          if [ -z "$(git status --porcelain pipeline/items pipeline/snapshots)" ]; then
            echo "The City's data has not changed. Nothing to save."
          else
            git config user.name "before-the-vote-refresh"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A pipeline/items pipeline/snapshots
            git add web/data/decisions.json web/data/calendar.ics
            git commit -m "Refresh from the City of Toronto's Open Data"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v4
